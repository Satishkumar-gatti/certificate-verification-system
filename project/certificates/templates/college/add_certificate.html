{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Add Certificate</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            background-image: url("{% static 'image/college.png' %}");
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logout-btn {
            position: fixed;
            top: 20px;
            right: 30px;
            background-color: red;
            color: white;
            padding: 8px 15px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .form-box {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(4px);
            padding: 30px 25px;
            border-radius: 10px;
            width: 320px;
            text-align: center;
        }

        .form-box h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .form-box input {
            width: 100%;
            padding: 8px;
            margin: 6px 0 12px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: white;
            font-size: 13px;
        }

        .form-box button[type="submit"] {
            width: 100%;
            padding: 9px;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        .form-box button[type="submit"]:hover {
            background: #555;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 12px;
            color: #333;
            text-decoration: none;
            font-size: 13px;
        }

        .back-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <form action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <button class="logout-btn" type="submit">🚪 Logout</button>
    </form>

    <div class="form-box">
        <h2>Add Certificate</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="name" placeholder="Student Name">
            <input type="text" name="course" placeholder="Course">
            <input type="text" name="grade" placeholder="Grade">
            <input type="text" name="issued_by" placeholder="Issued By">
            <button type="submit">Upload</button>
        </form>
        <a href="{% url 'add_certificate' %}" class="back-btn"> Back</a>
    </div>

</body>
</html>

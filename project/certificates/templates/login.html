{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

 body{
    font-family:'Segoe UI', sans-serif;
    min-height:100vh;
    background-image:url("https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=1600&q=80");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;   

    padding:0;
}

/* Dark Overlay */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.35);
    z-index:-1;
}

/* Form Box */
.form-box{
    width:380px;
    padding:35px;
    border-radius:22px;
    background:rgba(255,255,255,0.88);
    backdrop-filter:blur(12px);
    box-shadow:0 15px 35px rgba(0,0,0,0.25);
    animation:slideDown 0.9s ease;
}

/* Heading */
.form-box h2{
    text-align:center;
    color:#0b2c5f;
    font-size:34px;
    margin-bottom:25px;
    font-weight:700;
}

/* Error Message */
.msg-error{
    background:#ffe3e3;
    color:#d10000;
    padding:10px;
    border-radius:8px;
    text-align:center;
    margin-bottom:18px;
    font-size:14px;
}

/* Labels */
.form-box label{
    display:block;
    margin-bottom:6px;
    color:#222;
    font-size:14px;
    font-weight:600;
}

/* Inputs */
.form-box input{
    width:100%;
    padding:13px 14px;
    margin-bottom:16px;
    border:none;
    outline:none;
    border-radius:12px;
    font-size:14px;
    background:#f2f6ff;
    transition:0.3s;
}

.form-box input:focus{
    transform:scale(1.02);
    box-shadow:0 0 0 2px #1e90ff;
}

/* Button */
.form-box button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#1e90ff,#0066ff);
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

.form-box button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(0,102,255,0.35);
}

/* Back */
.back-btn{
    display:block;
    text-align:center;
    margin-top:15px;
    color:#0b2c5f;
    text-decoration:none;
    font-weight:600;
}

.back-btn:hover{
    color:#0066ff;
}

/* Animation */
@keyframes slideDown{
    from{
        opacity:0;
        transform:translateY(-50px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Mobile */
@media(max-width:450px){
    .form-box{
        width:92%;
        padding:28px;
    }

    .form-box h2{
        font-size:28px;
    }
}
</style>
</head>

<body>

<div class="form-box">

    <h2>Welcome Back</h2>

    {% if error %}
        <p class="msg-error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Email Address</label>
        <input type="email" name="email" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>

        <button type="submit"> Login Now</button>
    </form>

    <a href="/" class="back-btn"> Back to Home</a>

</div>

</body>
</html>

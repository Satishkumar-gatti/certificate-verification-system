{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>Verify Certificate</title>

<style>
body {
    margin: 0;
    height: 100vh;

    /* 🔥 Clear Background Image */
    background: url("{% static 'images/verify.png' %}") no-repeat center center;
    background-size: cover;
    background-attachment: fixed;

    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

/* 💎 Glass Card (no dark overlay) */
.card {
    background: rgba(255, 255, 255, 0.15); /* light glass */
    padding: 35px;
    border-radius: 20px;
    width: 350px;
    text-align: center;
    color: #291515;

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    border: 1px solid rgba(255,255,255,0.3);
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}

.card h3 {
    margin-bottom: 20px;
}

/* ✨ Inputs */
input {
    width: 100%;
    margin: 10px 0;
    padding: 12px;

    border-radius: 10px;
    border: none;
    outline: none;

    background: rgba(18, 99, 165, 0.3);
    color: #fff;
}

input::placeholder {
    color: #eee;
}

/* 🚀 Button */
button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;

    border-radius: 25px;
    border: none;

    background: linear-gradient(45deg, #00c6ff, #6c90bd);
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
}

/* 🔙 Back button */
.back {
    margin-top: 15px;
    display: inline-block;
    color: #181818;
    text-decoration: none;
    font-size: 14px;
}

.back:hover {
    text-decoration: underline;
}
</style>

</head>

<body>

<div class="card">

<h3>Verify Certificate</h3>

<form method="POST">
    {% csrf_token %}
    <input type="text" name="name" placeholder="Name" required>
    <input type="text" name="course" placeholder="Course" required>
    <input type="text" name="grade" placeholder="Grade" required>
    <input type="text" name="issued_by" placeholder="Issued By" required>

    <button type="submit">Verify</button>
</form>

<a href="{% url 'home' %}" class="back"> Back</a>

</div>

</body>
</html>

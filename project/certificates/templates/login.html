<!DOCTYPE html>
<html>
{% load static %}
<head>
<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>

/* 🔥 BACKGROUND */
body {
    margin: 0;
    height: 100vh;

    background: url("{% static 'images/login.jpg' %}") no-repeat center center/cover;
    font-family: 'Poppins', sans-serif;
}

/* 🔥 CENTER */
.container-box {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 💎 GLASS CARD */
.card {
    width: 380px;
    padding: 35px;
    border-radius: 20px;

    background: rgba(255,255,255,0.15);   /* 🔥 transparent */
    backdrop-filter: blur(12px);          /* 💎 glass effect */

    border: 1px solid rgba(255,255,255,0.3);

    box-shadow: 0 8px 30px rgba(0,0,0,0.4);

    text-align: center;
}

/* TITLE */
h3 {
    margin-bottom: 20px;
    font-weight: 600;
    color: white;
}

/* 💎 INPUT */
input {
    width: 100%;
    padding: 12px 15px;
    margin-bottom: 15px;

    border-radius: 50px;   /* 🔥 full round */
    border: none;

    background: rgba(255,255,255,0.9);
    outline: none;
}

/* INPUT FOCUS */
input:focus {
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

/* 🔥 BUTTON */
button {
    width: 100%;
    padding: 10px;

    border-radius: 50px;
    border: none;

    background: linear-gradient(45deg, #000, #434343);
    color: white;

    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
}

/* 🔗 LINKS */
.link {
    margin-top: 10px;
    display: block;
    text-decoration: none;
    color: #ddd;
}

.link:hover {
    color: white;
}

/* BACK BUTTON */
.back-btn {
    margin-top: 10px;
    display: block;

    background: rgba(0,0,0,0.7);
    color: white;

    padding: 8px;
    border-radius: 50px;
    text-decoration: none;
}

.back-btn:hover {
    background: black;
}

/* ERROR */
.error {
    color: #ff4d4d;
}

</style>
</head>

<body> 

<div class="container-box">

    <div class="card">

        <h3>Welcome Back 👋</h3>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Login</button>
        </form>

        <a href="{% url 'register' %}" class="link">Create new account</a>
        <a href="{% url 'home' %}" class="back-btn">Back</a>

    </div>

</div>

</body>
</html>

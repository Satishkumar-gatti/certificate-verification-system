<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Navbar */
        nav {
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 30px;
        }

        nav .logo {
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        nav ul a:hover {
            color: #aaa;
        }

        /* Background image */
        .hero {
            width: 100%;
            height: calc(100vh - 48px);
            background-image: url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?w=1600&q=80');    
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="logo">Certificate Verification</a>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/about/">About</a></li>
            <li><a href="/login/">Login</a></li>
            <li><a href="/register/">Register</a></li>
        </ul>
    </nav>

    <div class="hero"></div>

</body>
</html>

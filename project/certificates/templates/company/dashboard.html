{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>Company Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;

    background-image: url("{% static 'images/company.jpg' %}");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    height: 100vh;
}

/* CENTER */
.container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* CARD */
.card {
    background: rgba(255,255,255,0.7);
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

/* BUTTON */
.logout-btn {
    display: block;
    margin-top: 20px;
    padding: 12px 25px;
    text-decoration: none;
    color: white;
    border-radius: 25px;
    font-weight: bold;
    background: red;
}
</style>

</head>

<body>

<div class="container">

    <div class="card">

        <h2>Welcome {{ name }} 👋</h2>
        <p>🏢 Company Dashboard</p>

        <a href="{% url 'logout' %}" class="logout-btn">Logout</a>

    </div>

</div>

</body>
</html>

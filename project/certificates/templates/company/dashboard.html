{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Company Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            background-image: url("{% static 'image/company.png' %}");
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Top Right Logout Button */
        .logout-form {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .logout-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #e53935;
            color: white;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #c62828;
        }

        .box {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(4px);
            padding: 30px 25px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }

        .box h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .box p {
            color: #555;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .box a {
            display: block;
            padding: 10px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .box a:hover {
            background: #555;
        }
    </style>
</head>

<body>
    <form action="{% url 'logout' %}" method="post" class="logout-form">
        {% csrf_token %}
        <button type="submit" class="logout-btn"> Logout</button>
    </form>
    <div class="box">
        <h2>Company Dashboard</h2>
        <p>Welcome, {{ user.name }}!</p>
        <a href="/verify/">Verify Certificate</a>
    </div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;

    /* 🔥 FULL BACKGROUND */
    background: url('/static/images/register.jpg') no-repeat center center fixed;
    background-size: cover;
}

/* 🔥 CONTAINER */
.container {
    position: fixed;
    width: 100%;
    height: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    transform: translateY(40px); /* 🔥 konchem down from center */
}

/* 🔥 CARD */
.card {
    width: 90%;
    max-width: 350px;   /* medium size */
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(6px);
    border-radius: 15px;
    padding: 25px;
    text-align: center;
    color: black;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

/* 🔥 INPUTS */
input, select {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border-radius: 8px;
    border: 1px solid rgba(0,0,0,0.2);
    background: rgba(255,255,255,0.9);
    font-size: 14px;
    outline: none;
}

/* 🔥 BUTTON */
button {
    width: 100%;
    padding: 10px;
    background: black;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 10px;
}

button:hover {
    background: #333;
}

/* 🔥 BACK BUTTON */
.back-btn {
    display: block;
    text-decoration: none;
    color: white;
    background: black;
    padding: 8px;
    border-radius: 20px;
    font-size: 14px;
}
</style>

</head>

<body>

<div class="container">

  <div class="card">

    <h3>Register</h3>

    <form method="POST">
      {% csrf_token %}

      <input type="text" name="name" placeholder="Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>

      <select name="role">
        <option value="student">Student</option>
        <option value="college">College</option>
        <option value="company">Company</option>
      </select>

      <button type="submit">Register</button>

      <a href="/" class="back-btn">Back</a>

    </form>
 {% if error %}
 <p style="color:red;">{{ error }}</p>
 {% endif %}
  </div>

</div>

</body>
</html>

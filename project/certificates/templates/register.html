{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI', sans-serif;
    min-height:100vh;
    background-image:url("{% static 'image/register.jpg' %}");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    /* 🔥 form bottom ki move */
    padding-top:130px;
    padding-bottom:80px;

    overflow-y:auto;
}

/* Form Box */
.form-box{
    width:380px;
    padding:35px;
    border-radius:20px;
    background:#ffffffef;
    box-shadow:0 12px 35px rgba(0,0,0,0.25);
    animation:fadeIn 1s ease;
}

/* Heading */
.form-box h2{
    text-align:center;
    color:#0b2c5f;
    font-size:32px;
    margin-bottom:25px;
    font-weight:700;
}

/* Labels */
.form-box label{
    display:block;
    margin-bottom:6px;
    color:#222;
    font-size:14px;
    font-weight:600;
}

/* Inputs */
.form-box input,
.form-box select{
    width:100%;
    padding:12px 14px;
    margin-bottom:16px;
    border:1px solid #ccc;
    border-radius:10px;
    outline:none;
    font-size:14px;
    background:white;
}

.form-box input:focus,
.form-box select:focus{
    border-color:#1e90ff;
    box-shadow:0 0 8px rgba(30,144,255,0.20);
}

/* Button */
.form-box button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#1e90ff,#0066ff);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.form-box button:hover{
    transform:translateY(-2px);
}

/* Back */
.back-btn{
    display:block;
    text-align:center;
    margin-top:15px;
    color:#0b2c5f;
    text-decoration:none;
    font-weight:600;
}

.back-btn:hover{
    color:#0066ff;
}

/* Messages */
.msg-error{
    background:#ffdede;
    color:#c40000;
    padding:10px;
    border-radius:8px;
    text-align:center;
    margin-bottom:15px;
}

.msg-success{
    background:#ddffdd;
    color:#008000;
    padding:10px;
    border-radius:8px;
    text-align:center;
    margin-bottom:15px;
}

/* Animation */
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(-30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="form-box">

<h2>Create Account</h2>

{% if error %}
<p class="msg-error">{{ error }}</p>
{% endif %}

{% if message %}
<p class="msg-success">{{ message }}</p>
{% endif %}

<form method="POST">
{% csrf_token %}

<label>Full Name</label>
<input type="text" name="name" required>

<label>Email Address</label>
<input type="email" name="email" required>

<label>Password</label>
<input type="password" name="password" required>

<label>Select Role</label>
<select name="role" required>
<option value="student">Student</option>
<option value="college">College</option>
<option value="company">Company</option>
</select>

<button type="submit"> Register Now</button>
</form>

<a href="/" class="back-btn"> Back to Home</a>

</div>

</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Certificate</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
}

/* Dynamic Floating Circles */
body::before,
body::after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    animation:float 8s infinite ease-in-out;
}

body::before{
    top:-80px;
    left:-80px;
}

body::after{
    bottom:-80px;
    right:-80px;
    animation-delay:2s;
}

/* Form Box */
.form-box{
    width:420px;
    padding:35px;
    border-radius:22px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(14px);
    box-shadow:0 20px 40px rgba(0,0,0,0.25);
    animation:slideDown 1s ease;
    z-index:2;
}

/* Heading */
.form-box h2{
    text-align:center;
    color:#fff;
    font-size:32px;
    margin-bottom:25px;
    font-weight:700;
}

/* Labels */
.form-box label{
    display:block;
    color:#fff;
    font-size:14px;
    margin-bottom:7px;
    font-weight:600;
}

/* Inputs */
.form-box input{
    width:100%;
    padding:13px;
    margin-bottom:16px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,0.92);
    font-size:14px;
    transition:0.3s;
}

.form-box input:focus{
    transform:scale(1.02);
    box-shadow:0 0 0 2px #38bdf8;
}

/* Button */
.form-box button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

.form-box button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(34,197,94,0.35);
}

/* Animations */
@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(25px);}
}

@keyframes slideDown{
    from{
        opacity:0;
        transform:translateY(-50px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Mobile */
@media(max-width:480px){
    .form-box{
        width:92%;
        padding:25px;
    }

    .form-box h2{
        font-size:26px;
    }
}
</style>
</head>

<body>

<div class="form-box">

<h2>🔍 Verify Certificate</h2>

<form method="POST">
{% csrf_token %}

<label>Student Name</label>
<input type="text" name="name" placeholder="Enter student name" required>

<label>Course</label>
<input type="text" name="course" placeholder="Enter course name" required>

<label>Grade</label>
<input type="text" name="grade" placeholder="Enter grade" required>

<label>Issued By</label>
<input type="text" name="issued_by" placeholder="Enter issuer name" required>

<button type="submit">✅ Verify Now</button>

</form>

</div>

</body>
</html>
